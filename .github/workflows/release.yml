name: Release
# The gate refuses a tag that differs from the Cargo.toml version: bump Cargo.toml in a PR,
# merge it, wait for "CI OK" on main, then push the matching v<version> tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1

  binaries:
    name: Binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/rust-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      # Same assets as v1.0.1: http-proxy-lb-<tag>-<target-triple>.tar.gz with a top-level
      # http-proxy-lb-<tag>-<target-triple>/ folder (binary, README.md, LICENSE); the Windows
      # zip has the same files at its root. linux-arm64 is new (native arm runner).
      targets: >-
        [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
         {"label":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
         {"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},
         {"label":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","layout":"flat"}]
      asset-name: "{name}-{tag}-{target}"
      extra-files: |
        README.md
        LICENSE

  docker:
    name: Docker
    needs: gate
    if: needs.gate.outputs.is-tag == 'true' # dry runs never push images
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      promote-on-tag: true

  publish:
    name: GitHub Release
    needs: [gate, binaries, docker]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}
